name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Check Rust compilation (iOS device)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios

      - name: Override beforeBuildCommand for CI
        run: |
          sed -i '' 's/"npm run build"/"npx vite build"/' src-tauri/tauri.conf.json
          echo "beforeBuildCommand after override:"
          grep beforeBuildCommand src-tauri/tauri.conf.json

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable iOS code signing
        run: |
          PROJECT=$(find src-tauri/gen/apple -name "project.pbxproj" -maxdepth 4 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project file not found!"
            find src-tauri/gen/apple -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT"
          echo "::notice::Verifying code signing disabled:"
          grep "CODE_SIGN" "$PROJECT" || echo "  (no CODE_SIGN lines remain - OK)"

      - name: Build for iOS device (xcodebuild, no signing)
        id: ios-build
        run: |
          BUILD_LOG="build-output.log"
          XCODE_DIR="src-tauri/gen/apple"

          # xcodebuild with all signing disabled — produces bare .app for device
          set +e
          cd "$XCODE_DIR"
          xcodebuild \
            -project ddyj.xcodeproj \
            -scheme ddyj_iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            clean build \
            2>&1 | tee "../../../$BUILD_LOG"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          cd ../../..

          # Find .app
          APP=$(find "$XCODE_DIR/build" -name "*.app" -maxdepth 3 -type d 2>/dev/null | head -1)

          if [ -n "$APP" ]; then
            echo "::notice::App built successfully: $APP"

            # Package into unsigned IPA (Payload/*.app + zip)
            rm -rf output
            mkdir -p output/Payload
            cp -R "$APP" output/Payload/
            cd output
            zip -r ../DDYJ-unsigned.ipa Payload/
            cd ..
            rm -rf output

            echo "::notice::Unsigned IPA created: DDYJ-unsigned.ipa ($(du -sh DDYJ-unsigned.ipa | cut -f1))"
            echo "BUILD_SUCCESS=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::xcodebuild failed (exit $EXIT_CODE) and no .app found"
            echo "::group::build directory contents"
            find "$XCODE_DIR/build" -type d 2>/dev/null | head -50
            echo "::endgroup::"
            echo "::group::DerivedData search"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -10
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DDYJ-unsigned
          path: DDYJ-unsigned.ipa
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            src-tauri/gen/
            dist/
          retention-days: 7
