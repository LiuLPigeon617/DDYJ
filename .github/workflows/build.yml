name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Check Rust compilation (iOS simulator target)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Override beforeBuildCommand for CI
        run: |
          # Skip vue-tsc in CI since frontend was already built
          sed -i '' 's/"npm run build"/"npx vite build"/' src-tauri/tauri.conf.json

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable iOS code signing
        run: |
          PROJECT=$(find src-tauri/gen/apple -name "project.pbxproj" -maxdepth 4 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project file not found!"
            echo "Directory structure:"
            find src-tauri/gen/apple -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"
          # Clear any code signing identity (handles "iPhone Developer", "Apple Development", etc.)
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          # Remove entitlements line - entitlements force code signing
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT"
          echo "::notice::Code signing disabled in Xcode project"
          echo "Verifying..."
          grep -n "CODE_SIGN" "$PROJECT" || echo "(no CODE_SIGN lines remain)"

      - name: Build iOS (simulator)
        run: |
          set +e
          npx tauri ios build --target aarch64-apple-ios-sim --debug 2>&1
          EXIT_CODE=$?
          set -e

          # exit code 70 = IPA export failed (expected without signing)
          if [ $EXIT_CODE -eq 70 ]; then
            echo "::warning::IPA export failed (exit 70) - expected without code signing"
            APP=$(find src-tauri/gen/apple/build -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              echo "::notice::Built successfully: $APP"
              exit 0
            else
              echo "::error::No .app artifact found after build"
              exit 1
            fi
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          else
            echo "::notice::Build completed successfully"
            find src-tauri/gen/apple/build -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -3
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src-tauri/gen/
            dist/
          retention-days: 7
