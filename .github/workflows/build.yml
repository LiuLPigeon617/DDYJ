name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Check Rust compilation (iOS device)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios

      - name: Override beforeBuildCommand for CI
        run: |
          sed -i '' 's/"npm run build"/"npx vite build"/' src-tauri/tauri.conf.json
          echo "beforeBuildCommand after override:"
          grep beforeBuildCommand src-tauri/tauri.conf.json

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable iOS code signing
        run: |
          PROJECT=$(find src-tauri/gen/apple -name "project.pbxproj" -maxdepth 4 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project file not found!"
            find src-tauri/gen/apple -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT"
          echo "::notice::Verifying code signing disabled:"
          grep "CODE_SIGN" "$PROJECT" || echo "  (no CODE_SIGN lines remain - OK)"

      - name: Build for iOS device (xcodebuild, no signing)
        id: ios-build
        run: |
          BUILD_LOG="build-output.log"
          XCODE_DIR="src-tauri/gen/apple"

          # xcodebuild with all signing disabled — produces bare .app for device
          set +e
          cd "$XCODE_DIR"
          xcodebuild \
            -project ddyj.xcodeproj \
            -scheme ddyj_iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            clean build \
            2>&1 | tee "../../../$BUILD_LOG"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          cd ../../..

          # Find .app
          APP=$(find "$XCODE_DIR/build" -name "*.app" -maxdepth 3 -type d 2>/dev/null | head -1)

          if [ -n "$APP" ]; then
            echo "::notice::App built successfully: $APP"
            echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"
            echo "BUILD_SUCCESS=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::xcodebuild failed (exit $EXIT_CODE) and no .app found"
            echo "::group::build directory contents"
            find "$XCODE_DIR/build" -type d 2>/dev/null | head -50
            echo "::endgroup::"
            echo "::group::DerivedData search"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -10
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify and fix Info.plist
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"
          echo "=== App path: $APP ==="
          echo "=== .app directory name: $(basename "$APP") ==="

          PLIST="$APP/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found in .app!"
            exit 1
          fi

          echo "=== Info.plist contents (raw) ==="
          plutil -p "$PLIST" || cat "$PLIST"

          echo ""
          echo "=== Checking critical keys ==="

          # Check CFBundleExecutable
          BUNDLE_EXEC=$(plutil -extract CFBundleExecutable raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_EXEC" ] || [ "$BUNDLE_EXEC" = "$(null)" ]; then
            echo "::error::CFBundleExecutable is missing or null!"
            # Fix: set it to the .app directory name without extension
            APP_NAME=$(basename "$APP" .app)
            echo "  -> Fixing CFBundleExecutable to: $APP_NAME"
            plutil -replace CFBundleExecutable -string "$APP_NAME" "$PLIST"
          else
            echo "  CFBundleExecutable = $BUNDLE_EXEC (OK)"
          fi

          # Check CFBundleIdentifier
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "$(null)" ]; then
            echo "::error::CFBundleIdentifier is missing or null!"
            plutil -replace CFBundleIdentifier -string "com.ddyj.earthquake" "$PLIST"
          else
            echo "  CFBundleIdentifier = $BUNDLE_ID (OK)"
          fi

          # Check CFBundleName
          BUNDLE_NAME=$(plutil -extract CFBundleName raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_NAME" ] || [ "$BUNDLE_NAME" = "$(null)" ]; then
            echo "::warning::CFBundleName is missing or null, setting to DDYJ"
            plutil -replace CFBundleName -string "DDYJ" "$PLIST"
          else
            echo "  CFBundleName = $BUNDLE_NAME (OK)"
          fi

          # Check CFBundleShortVersionString
          BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_VERSION" ] || [ "$BUNDLE_VERSION" = "$(null)" ]; then
            echo "::warning::CFBundleShortVersionString is missing, setting to 0.1.0"
            plutil -replace CFBundleShortVersionString -string "0.1.0" "$PLIST"
          fi

          # Verify executable exists inside .app
          BUNDLE_EXEC=$(plutil -extract CFBundleExecutable raw "$PLIST" 2>/dev/null)
          if [ ! -f "$APP/$BUNDLE_EXEC" ]; then
            echo "::error::Executable file '$BUNDLE_EXEC' not found inside .app!"
            echo "  Contents of .app:"
            ls -la "$APP/"
            exit 1
          fi
          echo "  Executable '$BUNDLE_EXEC' exists in .app (OK)"

          echo ""
          echo "=== Fixed Info.plist ==="
          plutil -p "$PLIST"

      - name: Ad-hoc sign the app
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"

          # Create entitlements file with get-task-allow (required by LiveContainer)
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== Ad-hoc signing the .app ==="
          # codesign -s - does ad-hoc signing (no certificate needed)
          # This allows LiveContainer JIT-Less mode to properly load the app
          codesign -f -s - --entitlements /tmp/entitlements.plist "$APP"
          echo "Ad-hoc signing complete"

          # Verify signing
          echo "=== Verifying signature ==="
          codesign -dvv "$APP" 2>&1 || echo "(verification output above)"

      - name: Package IPA
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"

          echo "=== Packaging IPA ==="
          rm -rf output
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/

          # Verify Payload structure
          echo "=== Payload structure ==="
          find output -maxdepth 3 -type f | head -30
          echo ""

          cd output
          zip -r ../DDYJ-unsigned.ipa Payload/
          cd ..
          rm -rf output

          echo "::notice::IPA created: DDYJ-unsigned.ipa ($(du -sh DDYJ-unsigned.ipa | cut -f1))"

          # Verify IPA structure
          echo "=== IPA contents ==="
          unzip -l DDYJ-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DDYJ-unsigned
          path: DDYJ-unsigned.ipa
          retention-days: 30

      - name: Upload build diagnostics (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-output.log
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            src-tauri/gen/
            dist/
          retention-days: 7
