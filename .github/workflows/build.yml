name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Check Rust compilation (iOS device)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios

      - name: Override beforeBuildCommand for CI
        run: |
          sed -i '' 's/"npm run build"/"npx vite build"/' src-tauri/tauri.conf.json
          echo "beforeBuildCommand after override:"
          grep beforeBuildCommand src-tauri/tauri.conf.json

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable iOS code signing
        run: |
          PROJECT=$(find src-tauri/gen/apple -name "project.pbxproj" -maxdepth 4 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project file not found!"
            find src-tauri/gen/apple -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT"
          echo "::notice::Verifying code signing disabled:"
          grep "CODE_SIGN" "$PROJECT" || echo "  (no CODE_SIGN lines remain - OK)"

      - name: Build for iOS device (xcodebuild, no signing)
        id: ios-build
        run: |
          BUILD_LOG="build-output.log"
          XCODE_DIR="src-tauri/gen/apple"

          # xcodebuild with all signing disabled — produces bare .app for device
          set +e
          cd "$XCODE_DIR"
          xcodebuild \
            -project ddyj.xcodeproj \
            -scheme ddyj_iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            GENERATE_INFOPLIST_FILE=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            clean build \
            2>&1 | tee "../../../$BUILD_LOG"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          cd ../../..

          echo "=== xcodebuild exit code: $EXIT_CODE ==="

          # List ALL .app directories found
          echo "=== All .app directories found ==="
          find "$XCODE_DIR/build" -name "*.app" -type d 2>/dev/null | while read app; do
            FILE_COUNT=$(find "$app" -type f 2>/dev/null | wc -l | tr -d ' ')
            HAS_PLIST="no"
            [ -f "$app/Info.plist" ] && HAS_PLIST="yes"
            echo "  $app (files: $FILE_COUNT, Info.plist: $HAS_PLIST)"
          done

          # Find the .app that has the most files (likely the real product)
          APP=""
          BEST_COUNT=0
          for candidate in $(find "$XCODE_DIR/build" -name "*.app" -type d 2>/dev/null); do
            FILE_COUNT=$(find "$candidate" -type f 2>/dev/null | wc -l | tr -d ' ')
            if [ "$FILE_COUNT" -gt "$BEST_COUNT" ]; then
              BEST_COUNT=$FILE_COUNT
              APP="$candidate"
            fi
          done

          if [ -n "$APP" ] && [ "$BEST_COUNT" -gt 0 ]; then
            echo "::notice::App built successfully: $APP ($BEST_COUNT files)"
            echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"
            echo "BUILD_SUCCESS=true" >> "$GITHUB_OUTPUT"
            echo "=== Contents of selected .app ==="
            ls -la "$APP/"
          else
            echo "::error::xcodebuild failed (exit $EXIT_CODE) and no valid .app found"
            echo "::group::build directory contents"
            find "$XCODE_DIR/build" -type f 2>/dev/null | head -50
            echo "::endgroup::"
            echo "::group::DerivedData search"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -10
            echo "::endgroup::"
            echo "::group::Last 50 lines of build log"
            tail -50 "../../../$BUILD_LOG" 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify and fix Info.plist
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"
          echo "=== App path: $APP ==="
          echo "=== .app directory name: $(basename "$APP") ==="
          echo "=== .app contents ==="
          ls -la "$APP/"
          echo ""

          PLIST="$APP/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "::warning::Info.plist not found in .app! Creating one manually."

            # Get the app name from the .app directory
            APP_NAME=$(basename "$APP" .app)

            # Try to find any plist inside the .app for reference
            OTHER_PLIST=$(find "$APP" -name "*.plist" -type f 2>/dev/null | head -1)
            if [ -n "$OTHER_PLIST" ]; then
              echo "  Found other plist: $OTHER_PLIST"
              plutil -p "$OTHER_PLIST" 2>/dev/null || true
            fi

            # Find the executable inside the .app
            EXECUTABLE=""
            for f in "$APP"/*; do
              if [ -f "$f" ] && [ -x "$f" ] && [ "$(basename "$f")" != "Info.plist" ]; then
                EXECUTABLE=$(basename "$f")
                echo "  Found executable: $EXECUTABLE"
                break
              fi
            done

            if [ -z "$EXECUTABLE" ]; then
              EXECUTABLE="$APP_NAME"
              echo "  No executable found, using app name: $EXECUTABLE"
            fi

            # Create Info.plist manually with all required keys
            cat > "$PLIST" << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleExecutable</key>
            <string>${EXECUTABLE}</string>
            <key>CFBundleIdentifier</key>
            <string>com.ddyj.earthquake</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>DDYJ</string>
            <key>CFBundleDisplayName</key>
            <string>地震预警</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>NSLocalNetworkUsageDescription</key>
            <string>DDYJ needs network access to fetch earthquake data</string>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          PLISTEOF
            echo "  Created Info.plist with CFBundleExecutable=$EXECUTABLE"
          else
            echo "=== Info.plist found, checking critical keys ==="
            plutil -p "$PLIST" || cat "$PLIST"
          fi

          # Verify and fix critical keys
          echo ""
          echo "=== Checking critical keys ==="

          # Check CFBundleExecutable
          BUNDLE_EXEC=$(plutil -extract CFBundleExecutable raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_EXEC" ] || [ "$BUNDLE_EXEC" = "(null)" ]; then
            echo "::warning::CFBundleExecutable is missing or null, fixing..."
            APP_NAME=$(basename "$APP" .app)
            plutil -replace CFBundleExecutable -string "$APP_NAME" "$PLIST" 2>/dev/null || true
            BUNDLE_EXEC="$APP_NAME"
          else
            echo "  CFBundleExecutable = $BUNDLE_EXEC (OK)"
          fi

          # Check CFBundleIdentifier
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || echo "")
          if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "(null)" ]; then
            echo "::warning::CFBundleIdentifier is missing or null, fixing..."
            plutil -replace CFBundleIdentifier -string "com.ddyj.earthquake" "$PLIST" 2>/dev/null || true
          else
            echo "  CFBundleIdentifier = $BUNDLE_ID (OK)"
          fi

          # Verify executable exists inside .app
          if [ -n "$BUNDLE_EXEC" ] && [ ! -f "$APP/$BUNDLE_EXEC" ]; then
            echo "::warning::Executable '$BUNDLE_EXEC' not found, searching for any executable..."
            for f in "$APP"/*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                FOUND_EXEC=$(basename "$f")
                echo "  Found executable: $FOUND_EXEC"
                plutil -replace CFBundleExecutable -string "$FOUND_EXEC" "$PLIST" 2>/dev/null || true
                BUNDLE_EXEC="$FOUND_EXEC"
                break
              fi
            done
          fi

          echo "  Executable '$BUNDLE_EXEC' check done"
          echo ""
          echo "=== Final Info.plist ==="
          plutil -p "$PLIST"

      - name: Ad-hoc sign the app
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"

          # Create entitlements file with get-task-allow (required by LiveContainer)
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== Ad-hoc signing the .app ==="
          codesign -f -s - --entitlements /tmp/entitlements.plist "$APP"
          echo "Ad-hoc signing complete"

          echo "=== Verifying signature ==="
          codesign -dvv "$APP" 2>&1 || echo "(verification output above)"

      - name: Package IPA
        run: |
          APP="${{ steps.ios-build.outputs.APP_PATH }}"

          echo "=== Packaging IPA ==="
          rm -rf output
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/

          # Verify Payload structure
          echo "=== Payload structure ==="
          find output -maxdepth 3 -type f | head -30
          echo ""

          cd output
          zip -r ../DDYJ-unsigned.ipa Payload/
          cd ..
          rm -rf output

          echo "::notice::IPA created: DDYJ-unsigned.ipa ($(du -sh DDYJ-unsigned.ipa | cut -f1))"

          # Verify IPA structure
          echo "=== IPA contents ==="
          unzip -l DDYJ-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DDYJ-unsigned
          path: DDYJ-unsigned.ipa
          retention-days: 30

      - name: Upload build diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-output.log
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            src-tauri/gen/
            dist/
          retention-days: 7
