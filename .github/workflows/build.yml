name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Check Rust compilation (iOS simulator)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim

      - name: Override beforeBuildCommand for CI
        run: |
          sed -i '' 's/"npm run build"/"npx vite build"/' src-tauri/tauri.conf.json
          echo "beforeBuildCommand after override:"
          grep beforeBuildCommand src-tauri/tauri.conf.json

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable iOS code signing
        run: |
          PROJECT=$(find src-tauri/gen/apple -name "project.pbxproj" -maxdepth 4 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project file not found!"
            find src-tauri/gen/apple -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT"
          echo "::notice::Verifying code signing disabled:"
          grep "CODE_SIGN" "$PROJECT" || echo "  (no CODE_SIGN lines remain - OK)"

      - name: Build iOS (simulator)
        id: ios-build
        run: |
          BUILD_LOG="build-output.log"
          set +e
          # Key fix: --target aarch64-sim (CLI short name), NOT aarch64-apple-ios-sim (Rust triple)
          # --ci: skip interactive prompts
          # --export-method debugging: simulator build (no signing)
          # -v: verbose output
          npx tauri ios build \
            --target aarch64-sim \
            --debug \
            --ci \
            --export-method debugging \
            -v \
            2>&1 | tee "$BUILD_LOG"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "BUILD_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # exit 0 = full success (build + IPA export both succeeded)  
          # exit 70 = IPA export failed (expected without signing), .app should exist
          if [ $EXIT_CODE -eq 0 ]; then
            echo "::notice::Build completed (IPA exported)"
          elif [ $EXIT_CODE -eq 70 ]; then
            echo "::warning::IPA export failed (exit 70) - expected without signing"
          else
            echo "::error::Build failed with exit code $EXIT_CODE"
          fi

          # Check for .app artifact
          APP=$(find src-tauri/gen/apple/build -name "*.app" -maxdepth 5 -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "::notice::App artifact found: $APP"
            echo "BUILD_SUCCESS=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::No .app artifact found"
            echo "BUILD_SUCCESS=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            src-tauri/gen/
            dist/
          retention-days: 7
